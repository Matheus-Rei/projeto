
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Jogo de Terror</title>

    <link rel="stylesheet" href="contato.css">
</head>

<body>

    <header>
        <h1>CONTATO</h1>
        <p>Entre em contato com os desenvolvedores.</p>
    </header>

    <nav>
        <a href="index.html">Início / Jogo</a>
        <a href="historia.html">História</a>
        <a href="cenarios.html">Cenários</a>
        <a href="itens.html">Itens</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <h2>Envie uma mensagem</h2>

        <form onsubmit="enviarFormulario(event)">

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="assunto">Assunto:</label>
            <input
                type="text"
                id="assunto"
                name="assunto"
                placeholder="Assunto da mensagem"
                required
            >

            <label for="mensagem">Mensagem:</label>
            <textarea
                id="mensagem"
                name="mensagem"
                placeholder="Escreva sua mensagem..."
                required
            ></textarea>

            <button type="submit">
                Enviar mensagem
            </button>

        </form>

        <div id="confirmacao">
            Mensagem enviada com sucesso! Obrigado pelo contato.
        </div>

    </main>

    <footer>
        <p>Jogo de Terror - Página de Contato</p>
    </footer>

    <script>
        function enviarFormulario(evento) {

            evento.preventDefault();

            document.getElementById("confirmacao").style.display = "block";

            document.querySelector("form").reset();

        }
    </script>

</body>
</html>
