
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 4 - Laboratório</title>

    <link rel="stylesheet" href="inventario.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #080808;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #cena {
            position: relative;
            width: min(100vw, calc(100dvh * 1648 / 928));
            aspect-ratio: 1648 / 928;
            overflow: hidden;
        }

        #imagem-cena {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        #cena button {
            position: absolute;
            z-index: 3;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        #botao-voltar {
            position: absolute;
            z-index: 10;
            top: 3%;
            left: 2%;
            width: 100px;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #777;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #botao-rato {
            left: 40%;
            top: 43%;
            width: 25%;
            height: 43%;
        }

        #botao-fechadura {
            left: 56.5%;
            top: 47%;
            width: 4%;
            height: 9%;
            display: none;
        }

        #botao-documento {
            left: 27%;
            top: 60%;
            width: 9%;
            height: 14%;
            display: none;
        }

        /* Área clicável para avançar à fase 5 */
        #botao-porta-aberta {
            z-index: 2 !important;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #aviso {
            position: absolute;
            z-index: 8;
            left: 50%;
            top: 12%;
            transform: translateX(-50%);
            display: none;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #777;
            color: white;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
        }

        #documento-overlay {
            position: absolute;
            z-index: 20;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
        }

        #documento-overlay.aberto {
            display: flex;
        }

        #documento-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #fechar-documento {
            position: absolute;
            top: 2%;
            left: 2%;
            width: 75px;
            height: 75px;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #cena {
                width: 100vw;
            }
        }
    </style>
</head>

<body>

    <div id="cena">

        <img
            id="imagem-cena"
            src="../imagens_finais/fase01/rato grande.png"
            alt="Laboratório com um rato monstruoso"
        >

        <button id="botao-voltar" onclick="voltarFase3()">
            VOLTAR
        </button>

        <button id="botao-rato" onclick="distrairRato()"></button>

        <button id="botao-fechadura" onclick="abrirPorta()"></button>

        <button id="botao-documento" onclick="abrirDocumento()"></button>

        <button
            id="botao-porta-aberta"
            onclick="irFase5()"
            title="Entrar na próxima sala"
        ></button>

        <div id="aviso"></div>

        <div id="documento-overlay">

            <img
                src="../imagens_finais/fase01/doc.png"
                alt="Documento encontrado no laboratório"
            >

            <button
                id="fechar-documento"
                onclick="fecharDocumento()"
            ></button>

        </div>

    </div>

    <div id="inventario">

        <button id="botao-inventario" onclick="abrirInventario()">
            🎒
        </button>

        <div id="painel-inventario">
            <h3>INVENTÁRIO</h3>
            <div id="itens-inventario"></div>
        </div>

    </div>

    <script src="inventario.js"></script>

    <script>
        const imagemCena = document.getElementById("imagem-cena");

        const botaoRato = document.getElementById("botao-rato");
        const botaoFechadura = document.getElementById("botao-fechadura");
        const botaoDocumento = document.getElementById("botao-documento");
        const botaoPortaAberta = document.getElementById("botao-porta-aberta");

        const aviso = document.getElementById("aviso");
        const documentoOverlay = document.getElementById("documento-overlay");

        let ratoDistraido =
            sessionStorage.getItem("fase4RatoDistraido") === "true";

        let portaAberta =
            sessionStorage.getItem("fase4PortaAberta") === "true";

        function voltarFase3() {
            window.location.href = "fase03.html";
        }

        function irFase5() {
            if (!portaAberta) {
                return;
            }

            window.location.href = "fase5.html";
        }

        function mostrarAviso(mensagem) {
            aviso.textContent = mensagem;
            aviso.style.display = "block";

            setTimeout(function() {
                aviso.style.display = "none";
            }, 2500);
        }

        function distrairRato() {
            if (ratoDistraido) {
                return;
            }

            let itens = JSON.parse(
                sessionStorage.getItem("itensInventario")
            ) || [];

            let queijoEncontrado = false;

            for (let i = 0; i < itens.length; i++) {
                if (itens[i].nome === "queijo") {
                    itens.splice(i, 1);
                    queijoEncontrado = true;
                    break;
                }
            }

            if (!queijoEncontrado) {
                mostrarAviso("Você precisa de algo para distrair o rato.");
                return;
            }

            sessionStorage.setItem(
                "itensInventario",
                JSON.stringify(itens)
            );

            sessionStorage.setItem("fase4RatoDistraido", "true");

            ratoDistraido = true;

            atualizarInventario();
            atualizarCena();
        }

        function abrirPorta() {
            if (!ratoDistraido || portaAberta) {
                return;
            }

            if (!possuiItem("chave")) {
                mostrarAviso("Você precisa de uma chave para abrir a fechadura.");
                return;
            }

            portaAberta = true;

            sessionStorage.setItem("fase4PortaAberta", "true");

            atualizarCena();
        }

        function abrirDocumento() {
            if (!portaAberta) {
                return;
            }

            documentoOverlay.classList.add("aberto");
        }

        function fecharDocumento() {
            documentoOverlay.classList.remove("aberto");
        }

        function atualizarCena() {
            if (portaAberta) {
                imagemCena.src =
                    "../imagens_finais/fase01/porta aberta.png";

                botaoRato.style.display = "none";
                botaoFechadura.style.display = "none";
                botaoDocumento.style.display = "block";
                botaoPortaAberta.style.display = "block";

            } else if (ratoDistraido) {
                imagemCena.src =
                    "../imagens_finais/fase01/rato destraido.png";

                botaoRato.style.display = "none";
                botaoFechadura.style.display = "block";
                botaoDocumento.style.display = "none";
                botaoPortaAberta.style.display = "none";

            } else {
                imagemCena.src =
                    "../imagens_finais/fase01/rato grande.png";

                botaoRato.style.display = "block";
                botaoFechadura.style.display = "none";
                botaoDocumento.style.display = "none";
                botaoPortaAberta.style.display = "none";
            }
        }

        atualizarCena();
        atualizarInventario();

    </script>

</body>
</html>
