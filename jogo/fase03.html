<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase do Elevador</title>

    <link rel="stylesheet" href="../css/ratos.css">
    <link rel="stylesheet" href="inventario.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #cena {
            position: relative;
            width: min(100vw, calc(100dvh * 1648 / 928));
            aspect-ratio: 1648 / 928;
            overflow: hidden;
        }

        #imagem, #manchete {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #imagem {
            z-index: 1;
        }

        #cena button {
            position: absolute;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        #botao-elevador {
            z-index: 2;
            left: 71.6%;
            top: 46.3%;
            width: 3%;
            height: 5%;
        }

        #botao-voltar {
            z-index: 8;
            left: 2%;
            top: 3%;
            width: 100px;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #777;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        #queijo {
            z-index: 2;
            left: 43%;
            top: 70%;
            width: 6%;
            height: 10%;
            display: none;
        }

        #jornal {
            z-index: 2;
            left: 49%;
            top: 70%;
            width: 12%;
            height: 10%;
            display: none;
        }

        #manchete {
            z-index: 6;
            display: none;
        }

        #fechar {
            z-index: 7;
            left: 18.5%;
            top: 7.5%;
            width: 5%;
            height: 8%;
            display: none;
        }

        #aviso-energia {
            position: absolute;
            z-index: 5;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #777;
            color: #ddd;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
        }

        #aviso-energia.aberto {
            display: block;
        }

        @media (max-width: 600px) {
            #cena {
                width: 100vw;
            }
        }
    </style>
</head>

<body>

    <div id="cena">

        <img
            id="imagem"
            src="../imagens_finais/fase01/Elevador Industrial Abandonado.png"
            alt="Elevador"
        >

        <button id="botao-elevador" onclick="abrirElevador()"></button>

        <button id="botao-voltar" onclick="voltarFase2()">VOLTAR</button>

        <button id="queijo" onclick="clicarQueijo()"></button>

        <button id="jornal" onclick="abrirManchete()"></button>

        <img
            id="manchete"
            src="../imagens_finais/fase01/manchete.png"
            alt="Manchete do jornal"
        >

        <button id="fechar" onclick="fecharManchete()"></button>

        <div id="aviso-energia">
            O elevador está sem energia. Conserte o gerador primeiro.
        </div>

        <div id="area-ratos">
            <div id="aviso-ratos">CLIQUE NOS RATOS PARA ELIMINÁ-LOS!</div>
        </div>

    </div>

    <div id="inventario">
        <button id="botao-inventario" onclick="abrirInventario()">🎒</button>

        <div id="painel-inventario">
            <h3>INVENTÁRIO</h3>
            <div id="itens-inventario"></div>
        </div>
    </div>

    <script src="../java.js/ratt.js"></script>
    <script src="inventario.js"></script>

    <script>
        const pasta = "../imagens_finais/fase01/";
        const imagem = document.getElementById("imagem");
        const botao = document.getElementById("botao-elevador");
        const queijo = document.getElementById("queijo");
        const jornal = document.getElementById("jornal");
        const manchete = document.getElementById("manchete");
        const fechar = document.getElementById("fechar");
        const avisoEnergia = document.getElementById("aviso-energia");

        const geradorAtivado = sessionStorage.getItem("geradorAtivado") === "true";

        function voltarFase2() {
            window.location.href = "fase2.html";
        }

        function abrirElevador() {
            if (!geradorAtivado) {
                avisoEnergia.classList.add("aberto");

                setTimeout(function() {
                    avisoEnergia.classList.remove("aberto");
                }, 2500);

                return;
            }

            imagem.src = pasta + "Queijo brilhante no elevador sombrio.png";
            botao.style.display = "none";

            if (!possuiItem("queijo")) {
                queijo.style.display = "block";
            }

            jornal.style.display = "block";

            iniciarRatos();
        }

        function clicarQueijo() {
            adicionarItem({
                nome: "queijo",
                icone: "🧀"
            });

            imagem.src = pasta + "Elevador Industrial com Jornal O diário.png";
            queijo.style.display = "none";
        }

        function abrirManchete() {
            manchete.style.display = "block";
            fechar.style.display = "block";
        }

        function fecharManchete() {
            manchete.style.display = "none";
            fechar.style.display = "none";
        }
    </script>

</body>
</html>
