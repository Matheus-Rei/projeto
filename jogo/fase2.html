
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 2</title>

    <link rel="stylesheet" href="fase02.css">
    <link rel="stylesheet" href="inventario.css">

    <script src="fase02.js" defer></script>
    <script src="inventario.js" defer></script>
</head>

<body>
    <main id="cena">
        <img
            id="cenario"
            src="../imagens_finais/fase01/Elevador Enferrujado no Subsolo Industrial.png"
            alt="Cenário do laboratório"
        >

        <button id="botao-carta" onclick="abrirCarta()" aria-label="Abrir carta"></button>

        <button id="botao-gerador" onclick="abrirGerador()" aria-label="Examinar gerador"></button>

        <button id="botao-escada" onclick="subirEscada()" aria-label="Subir escadaria"></button>

        <button id="botao-chave" onclick="coletarChave()" aria-label="Coletar chave">
            🔑
        </button>
    </main>

    <div id="modal-carta" onclick="fecharCartaFundo(event)">
        <div id="area-imagem-carta">
            <img
                id="imagem-carta"
                src="../imagens_finais/fase01/carta.png"
                alt="Carta do cientista"
            >

            <button id="fechar" onclick="fecharCarta()" aria-label="Fechar carta"></button>
        </div>
    </div>

    <div id="modal-gerador" onclick="fecharGeradorFundo(event)">
        <section id="painel-gerador">

            <div id="topo-painel">
                <h2>PAINEL ELÉTRICO</h2>
                <button id="fechar-gerador" onclick="fecharGerador()" aria-label="Fechar">X</button>
            </div>

            <p id="instrucao">
                Reconecte os fios para restabelecer a energia.
            </p>

            <div id="placa">
                <svg id="fios-svg"></svg>

                <div class="coluna-fios" id="origens">
                    <button class="fio vermelho" data-color="vermelho" onclick="selecionarFio(this)">
                        <span class="terminal"></span>
                        Fio 01
                    </button>

                    <button class="fio azul" data-color="azul" onclick="selecionarFio(this)">
                        <span class="terminal"></span>
                        Fio 02
                    </button>

                    <button class="fio amarelo" data-color="amarelo" onclick="selecionarFio(this)">
                        <span class="terminal"></span>
                        Fio 03
                    </button>

                    <button class="fio verde" data-color="verde" onclick="selecionarFio(this)">
                        <span class="terminal"></span>
                        Fio 04
                    </button>
                </div>

                <div class="coluna-fios" id="destinos">
                    <button class="fio verde" data-color="verde" onclick="conectarFio(this)">
                        Terminal D
                        <span class="terminal"></span>
                    </button>

                    <button class="fio amarelo" data-color="amarelo" onclick="conectarFio(this)">
                        Terminal C
                        <span class="terminal"></span>
                    </button>

                    <button class="fio vermelho" data-color="vermelho" onclick="conectarFio(this)">
                        Terminal A
                        <span class="terminal"></span>
                    </button>

                    <button class="fio azul" data-color="azul" onclick="conectarFio(this)">
                        Terminal B
                        <span class="terminal"></span>
                    </button>
                </div>
            </div>

            <p id="mensagem-puzzle">
                Selecione uma ponta de fio.
            </p>

            <div id="controles-puzzle">
                <button id="reiniciar-puzzle" onclick="resetarPuzzle()">Reiniciar</button>
            </div>

            <div id="sucesso-gerador">
                <h2>ENERGIA RESTABELECIDA</h2>
                <p>O gerador voltou a funcionar.</p>
                <button id="continuar-gerador" onclick="continuarGerador()">Continuar</button>
            </div>

        </section>
    </div>

    <div id="inventario">
        <button id="botao-inventario" onclick="abrirInventario()">🎒</button>

        <div id="painel-inventario">
            <h3>INVENTÁRIO</h3>
            <div id="itens-inventario"></div>
        </div>
    </div>
</body>
</html>
